name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: JS-Indicators
    steps:
      # The parity project references ../StockSharp (GitHub), so reproduce the same
      # sibling layout used by local development inside GITHUB_WORKSPACE.
      - name: Checkout JS-Indicators
        uses: actions/checkout@v6
        with:
          path: JS-Indicators
      - name: Checkout StockSharp parity source
        uses: actions/checkout@v6
        with:
          repository: StockSharp/StockSharp
          ref: master
          path: 'StockSharp (GitHub)'
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Test (typecheck + public API + node suite)
        run: npm test
      - name: Build the package and bundle
        run: npm run build
      - name: Verify the publish tarball
        run: npm run pack:check
